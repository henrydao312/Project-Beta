# Example backtest configuration - the graded equity core.
#
# Every published result traces to one of these files. The date range and
# walk-forward windows below are the verified defaults: SIP 5-minute history
# begins 2016-06-10 (confirmed by API probe; 2015 returns nothing), and
# 30/6/6 over that span yields ~14 folds.
run_id: run_example_backtest
mode: backtest # backtest | paper | replay

data:
  symbol: SPY
  asset_class: equity # equity | crypto | option
  provider: alpaca
  timeframe: 5Min
  feed: sip # sip for backtest, iex for paper (see config.py)
  session: rth_only # extended-hours bars are filtered at ingestion
  start: 2016-06-10
  end: 2026-06-30
  dataset_hash: null # set once the dataset is built

risk:
  max_drawdown: 0.15
  daily_loss_limit: 500.0
  max_position: 10000.0
  sizing: vol_adjusted_v1
  risk_per_trade: 0.005 # fraction of equity risked entry-to-stop
  halt:
    data_staleness_bars: 3
    max_consecutive_api_errors: 5
    auto_halt_enabled: true
  regime_abstain: [] # set from evidence after M2 calibration

# Parameters live in the config, not in the strategy code, so a threshold sweep
# is a new file rather than an edit to the rules (Outline §5.3). `tier` decides
# whether this run may enter the graded ablation; the harness refuses a graded
# comparison for tier: secondary.
# M1 and M2 parameters. Everything here changes every model number, so it lives
# in the config and travels into `config_hash` and every results row. These
# were module defaults until 2026-09-04, which let two materially different
# runs share a hash.
models:
  labels:
    horizon_bars: 78 # also the training-window embargo: a label reads this far ahead
    trend_k: 0.5 # forward move, in units of the expected move at current vol
    vol_k: 1.15 # forward vol, relative to contemporaneous, that flags 'high'
  permitted_regimes: [uptrend] # the primary strategy is long-only
  high_vol_size: 0.5 # a gate may shrink and may never enlarge
  regime_l2: 1.0
  signal_quality_l2: 1.0
  min_validation_trades: 20

strategy:
  name: momentum_breakout
  version: mom_v1
  tier: primary # primary | secondary (secondary is backtest-only, exploratory)
  params:
    min_adx: 20.0
    min_range_expansion: 1.2
    min_ma_gap: 0.0
    breakout_tolerance: 0.0
    stop_vol_mult: 3.0
    target_r_multiple: 2.0
    cooldown_bars: 12

execution:
  fill_model: bar # bar | sparse_bar | quote (quote is declared, not available)
  commission_per_share: 0.0
  slippage_bps: 1.0
  fill_delay_bars: 1 # decide on the close, fill on the next bar's open
  cost_multiplier: 1.0 # 2.0 and 3.0 produce the cost-stress runs
  max_hold_bars: 78 # one regular session at 5 minutes
  flatten_at_session_end: true

# Absence is meaningful: a run with no walk_forward block makes no
# walk-forward performance claim. See configs/example_options.yaml.
walk_forward:
  train_months: 30
  validation_months: 6 # thresholds are chosen here, never on the test window
  test_months: 6
  step_months: 6

seed: 42
