name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest

# Keep this fast and shallow on purpose.
#
# Never run model training or large dataset work here — CI answers "does it
# still work?", not "is the model good?". And never disable a failing test to
# get a green check: the test caught something, so fix that instead.
