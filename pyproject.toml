[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-beta"
version = "0.1.0"
description = "AI-assisted paper-trading research platform (CIS 5980 capstone)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  # numpy is used directly by the models and the bootstrap, not only via
  # pandas, so it is declared rather than inherited.
  "numpy>=1.26",
  "pyyaml>=6.0",
  "requests>=2.31",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
# ruff is pinned to a minor range on purpose. `ruff check .` runs in CI, and
# ruff expands its default rule set between minor releases - an unpinned
# linter means the build goes red on a Tuesday because a tool shipped, with no
# change to this repository. Widening the pin is a deliberate act: bump it,
# run the lint, fix what it found.
dev = ["pytest>=8.0", "ruff>=0.16,<0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["canary: drift detectors for live services; skipped until the service exists"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Selected explicitly rather than inherited. The default set is whatever the
# installed ruff happens to think today, and CI enforcing a moving target is
# not enforcement.
#
#   E4/E7/E9, F  the historic defaults: imports, statements, errors
#   I            import order, so diffs stay about the code
#   B            bugbear, which catches the mutable-default class of bug
#   RUF          ruff's own checks, including stale noqa comments
#
# pyupgrade (UP) is deliberately absent. Its 3.11+ rewrites - `datetime.UTC`
# above all - would stop this package importing on Python 3.10, and the
# device-side Linux VM used for offline unit runs is 3.10. The package targets
# 3.11 and CI runs 3.11; keeping the source importable one version lower costs
# nothing and keeps that loop working.
select = ["E4", "E7", "E9", "F", "I", "B", "RUF"]
