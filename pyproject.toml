[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-beta"
version = "0.1.0"
description = "AI-assisted paper-trading research platform (CIS 5980 capstone)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["canary: drift detectors for live services; skipped until the service exists"]

[tool.ruff]
line-length = 100
target-version = "py311"
